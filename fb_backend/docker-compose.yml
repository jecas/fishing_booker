services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://booking:booking@db:5432/booking
      S3_ENDPOINT_URL: http://s3:5000
      S3_BUCKET_NAME: charter-photos
      S3_PUBLIC_URL: http://localhost:5000
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - .:/app
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      db:
        condition: service_healthy
  s3:
    image: motoserver/moto:5.2.4
    environment:
      MOTO_PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  postgres_data: