services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://booking:booking@db:5432/booking
      S3_ENDPOINT_URL: http://s3:5000
      S3_BUCKET_NAME: charter-photos
      S3_PUBLIC_URL: http://localhost:5000
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
      PAYMENT_PROVIDER_URL: http://payment-provider:8000
      REVIEWS_PROVIDER_URL: http://reviews-provider:8000
    volumes:
      - .:/app
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
      payment-provider:
        condition: service_healthy
      reviews-provider:
        condition: service_healthy
  s3:
    image: motoserver/moto:5.2.4
    environment:
      MOTO_PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  payment-provider:
    build: .
    environment:
      PAYMENT_DB_PATH: /data/payments.sqlite3
    volumes:
      - .:/app
      - payment-provider-data:/data
    command:
      - uvicorn
      - payment_service_mock.payment:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  reviews-provider:
    build: .
    volumes:
      - .:/app
    command:
      - uvicorn
      - review_service_mock.reviews:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
    ports:
      - "127.0.0.1:8004:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://booking:booking@db:5432/booking
    volumes:
      - .:/app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  seed:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://booking:booking@db:5432/booking
      S3_ENDPOINT_URL: http://s3:5000
      S3_BUCKET_NAME: charter-photos
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - .:/app
    command: ["python", "-m", "app.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+psycopg://booking:booking@test-db:5432/booking_test
    volumes:
      - .:/app
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres_data:
  payment-provider-data: